<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b3d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Karvan e Asal — Umrah Manager</title><style>
:root{--n:#071b3d;--b:#0d4a87;--g:#c89b2c;--bg:#f5f7fa;--line:#e5e7eb;--mut:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}header{background:linear-gradient(135deg,#061735,#0b3970);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:12px;align-items:center}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;margin:3px 0;opacity:.8}main{max-width:780px;margin:auto;padding:10px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #00000008}h2{color:var(--n);font-size:20px;margin:2px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{font-size:11px;font-weight:800;color:#475467;display:block;margin:2px 0 5px}input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font:inherit}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800}.primary{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;width:100%}.secondary{background:#fff;color:var(--n);border:1px solid #cbd5e1}.danger{background:#fff;color:#b42318;border:1px solid #efc0bc}.steps{display:flex;gap:5px;overflow:auto;margin-bottom:10px}.step{white-space:nowrap;border:0;border-radius:99px;padding:8px 10px;background:#edf1f5;color:#667085;font-weight:800;font-size:10px}.step.active{background:var(--n);color:#fff}.box{border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:9px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top strong{color:var(--n)}.small{font-size:11px;color:var(--muted)}.badge{background:#edf5ff;color:#1555a0;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grand{font-size:18px;font-weight:900;color:var(--n)}.metric{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric>div{background:#eef6ff;border-radius:13px;padding:11px}.metric b{display:block;color:var(--n);font-size:17px;margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px #0001}.nav button{border:0;background:none;color:#667085;font-size:9px;font-weight:800}.nav button.active{color:var(--n)}.nav span{display:block;font-size:20px}.invoice h3{margin:0;color:var(--n)}.invoice .section{border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0}.invoice h4{margin:0 0 5px;color:var(--n)}.notice{background:#fff9e8;border:1px solid #f3d58a;border-radius:12px;padding:10px;font-size:11px;color:#6b4d00}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.nav{max-width:780px;left:50%;right:auto;width:100%;transform:translateX(-50%);border-radius:18px 18px 0 0}}@media print{header,.nav,.no-print{display:none!important}.page{display:none!important}.page#invoice{display:block!important}.card{box-shadow:none;border:0}}
</style></head><body><header><div class="brand"><img src="assets/logo.png"><div><h1>KARVAN E ASAL</h1><p>UMRAH PACKAGE MANAGER</p></div></div></header><main>
<section id="new" class="page active"><div class="card"><h2>Create Umrah Quotation</h2><div class="steps" id="steps"></div><div id="wizard"></div></div></section>
<section id="manage" class="page"><div class="card"><h2>Management</h2><div style="display:flex;gap:6px;overflow:auto"><button class="btn secondary" onclick="manage('hotels')">Hotels</button><button class="btn secondary" onclick="manage('visa')">Visa</button><button class="btn secondary" onclick="manage('transport')">Transport</button><button class="btn secondary" onclick="manage('extras')">Extras</button></div><div id="manageBody"></div></div></section>
<section id="quotes" class="page"><div class="card"><h2>Saved Quotations</h2><div id="quotesBody"></div></div></section>
<section id="dashboard" class="page"><div class="card"><h2>Dashboard</h2><div class="metric"><div><span class="small">Quotations</span><b id="qc">0</b></div><div><span class="small">Hotels</span><b id="hc">0</b></div><div><span class="small">Visa Types</span><b id="vc">0</b></div><div><span class="small">Currency</span><b>SAR / PKR</b></div></div></div></section>
<section id="invoice" class="page"><div class="card"><div class="invoice" id="invoiceBody"></div><button class="btn primary no-print" onclick="window.print()">Print / Save PDF</button></div></section>
</main><nav class="nav"><button class="active" onclick="page('new',this)"><span>🧮</span>New</button><button onclick="page('dashboard',this)"><span>⌂</span>Dashboard</button><button onclick="page('manage',this)"><span>⚙️</span>Manage</button><button onclick="page('quotes',this)"><span>📋</span>Quotes</button><button onclick="page('invoice',this)"><span>🧾</span>Invoice</button></nav>
<script>
const rooms=['Sharing','Quint','Quad','Triple','Double','Full Room'];const airports=[['Islamabad','ISB','PK'],['Lahore','LHE','PK'],['Karachi','KHI','PK'],['Multan','MUX','PK'],['Sialkot','SKT','PK'],['Jeddah','JED','SA'],['Madinah','MED','SA'],['Riyadh','RUH','SA'],['Dubai','DXB','AE'],['Istanbul','IST','TR'],['Doha','DOH','QA'],['Abu Dhabi','AUH','AE'],['Muscat','MCT','OM']];
let hotels=JSON.parse(localStorage.keaHotels||'null')||[['Makkah','Wedam Six','Ibrahim Khalil Road','Shuttle',15,15,18,24,35,70],['Makkah','White Lion','Hijra Road','1100 M',20,20,24,32,49,95],['Makkah','Masarat Golden','Ibrahim Khalil Road','550 M',48,48,55,73,110,220],['Madinah','Qadat Al Dyyafah / Afaq Al Masi','Omer Bin Al Khattab Road','Shuttle',27,27,30,40,60,120],['Madinah','Hamouda Al Masi','Masjid Bilal Side','650 M',38,38,43,57,85,170],['Madinah','Ansar Golden Tulip','Markazia','100 M',null,null,100,133,200,400]];
let visas=JSON.parse(localStorage.keaVisa||'null')||[{name:'Umrah Visa',adult:765,child:765,infant:475,active:true}];let transports=JSON.parse(localStorage.keaTransport||'null')||[{name:'Airport Transfer',price:0,unit:'per vehicle'}];let extras=JSON.parse(localStorage.keaExtras||'null')||[{name:'Ziyarah',price:0,unit:'per person'}];let quotes=JSON.parse(localStorage.keaQuotes||'[]');let fx=+localStorage.keaFX||160;
let q;let step=0;const names=['Customer','Passengers','Journey','Hotels','Visa','Flights','Transport','Extras','Review'];
function $(x){return document.getElementById(x)}function money(x){return 'SAR '+(+x||0).toFixed(2)}function pkr(x){return 'PKR '+Math.round(+x||0)}function newQ(){q={customer:'',contact:'',ref:'Q-'+Date.now().toString().slice(-6),departureCity:'ISB',adults:1,childBed:0,childNoBed:0,infants:0,departure:'',arrival:'',returnDate:'',visa:visas[0].name,stays:[...Array(4)].map((_,i)=>({city:i%2?'Madinah':'Makkah',hotel:'',room:'Sharing',rooms:0,in:'',out:''})),flights:[{type:'Outbound',from:'ISB',to:'JED',date:'',flight:'',airline:'',via:'Direct'},{type:'Return',from:'JED',to:'ISB',date:'',flight:'',airline:'',via:'Direct'}],tickets:{adult:0,childBed:0,childNoBed:0,infant:0},transport:[],extras:[]};step=0;render()}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='dashboard')dash();if(id==='quotes')renderQuotes();if(id==='manage')manage('hotels');if(id==='invoice')renderInvoice()}
function nav(){return `<div style="display:flex;gap:7px;margin-top:13px"><button class="btn secondary" onclick="step=Math.max(0,step-1);render()">Back</button><button class="btn primary" onclick="step=Math.min(8,step+1);render()">Continue</button></div>`}
function render(){ $('steps').innerHTML=names.map((n,i)=>`<button class="step ${i===step?'active':''}" onclick="step=${i};render()">${i+1}. ${n}</button>`).join('');let w=$('wizard');if(step===0)w.innerHTML=`<h3>Customer & Origin</h3><div class="grid"><div class="full"><label>Customer Name</label><input value="${q.customer}" oninput="q.customer=this.value"></div><div><label>Contact</label><input value="${q.contact}" oninput="q.contact=this.value"></div><div><label>Reference</label><input value="${q.ref}" oninput="q.ref=this.value"></div><div><label>Departure City</label><select onchange="q.departureCity=this.value">${airports.filter(a=>a[2]==='PK').map(a=>`<option ${q.departureCity===a[1]?'selected':''}>${a[1]}</option>`).join('')}</select></div></div>${nav()}`;else if(step===1)w.innerHTML=`<h3>Passengers</h3><div class="grid">${pax('Adults','adults')}${pax('Child With Bed','childBed')}${pax('Child Without Bed','childNoBed')}${pax('Infants','infants')}</div><div class="notice">Infant: visa only by default. Child without bed: visa + ticket, no hotel-bed charge. Child with bed participates in hotel occupancy.</div>${nav()}`;else if(step===2)w.innerHTML=`<h3>Journey Dates</h3><div class="grid"><div><label>Departure from Pakistan</label><input type=date value="${q.departure}" onchange="q.departure=this.value"></div><div><label>Arrival in Saudi Arabia</label><input type=date value="${q.arrival}" onchange="q.arrival=this.value"></div><div><label>Return from Saudi Arabia</label><input type=date value="${q.returnDate}" onchange="q.returnDate=this.value"></div></div><div class=metric><div><span class=small>Makkah Nights</span><b>${cityN('Makkah')}</b></div><div><span class=small>Madinah Nights</span><b>${cityN('Madinah')}</b></div></div>${nav()}`;else if(step===3)w.innerHTML=`<h3>Accommodation</h3>${q.stays.map((s,i)=>stay(s,i)).join('')}${nav()}`;else if(step===4)w.innerHTML=`<h3>Visa</h3><label>Visa Type</label><select onchange="q.visa=this.value">${visas.filter(v=>v.active).map(v=>`<option ${q.visa===v.name?'selected':''}>${v.name}</option>`).join('')}</select><div class=box><div class=row><span>Adult</span><b>${money(vp('adult'))}</b></div><div class=row><span>Child</span><b>${money(vp('child'))}</b></div><div class=row><span>Infant</span><b>${money(vp('infant'))}</b></div></div>${nav()}`;else if(step===5)w.innerHTML=`<h3>Flights & Tickets</h3>${q.flights.map((f,i)=>flight(f,i)).join('')}<button class="btn secondary" onclick="q.flights.push({type:'Transit',from:'DXB',to:'JED',date:'',flight:'',airline:'',via:'Other'});render()">+ Add Flight Leg</button><div class=box><div class=grid><div><label>Adult Ticket PKR</label><input type=number value="${q.tickets.adult}" oninput="q.tickets.adult=+this.value||0"></div><div><label>Child With Bed PKR</label><input type=number value="${q.tickets.childBed}" oninput="q.tickets.childBed=+this.value||0"></div><div><label>Child Without Bed PKR</label><input type=number value="${q.tickets.childNoBed}" oninput="q.tickets.childNoBed=+this.value||0"></div><div><label>Infant Ticket PKR</label><input type=number value="${q.tickets.infant}" oninput="q.tickets.infant=+this.value||0"></div><div><label>PKR per SAR</label><input type=number value="${fx}" oninput="fx=+this.value||0;localStorage.keaFX=fx"></div></div></div>${nav()}`;else if(step===6)w.innerHTML=`<h3>Transportation</h3>${q.transport.map((x,i)=>`<div class=box><label>Service</label><select onchange="q.transport[${i}].name=this.value">${transports.map(t=>`<option ${x.name===t.name?'selected':''}>${t.name}</option>`).join('')}</select><label>Quantity</label><input type=number value="${x.qty||1}" onchange="q.transport[${i}].qty=+this.value||0"></div>`).join('')}<button class="btn secondary" onclick="q.transport.push({name:transports[0]?.name||'',qty:1});render()">+ Add Transport</button>${nav()}`;else if(step===7)w.innerHTML=`<h3>Additional Services</h3>${extras.map(x=>`<div class=box><label><input type=checkbox style="width:auto;min-height:0" ${q.extras.includes(x.name)?'checked':''} onchange="toggleExtra('${x.name}',this.checked)"> ${x.name} <span class=small>${money(x.price)} ${x.unit}</span></label></div>`).join('')}${nav()}`;else w.innerHTML=review()}
function pax(l,k){return `<div class=box><b>${l}</b><div style="display:flex;gap:6px;align-items:center;margin-top:7px"><button class="btn secondary" onclick="q.${k}=Math.max(0,q.${k}-1);render()">−</button><input style="text-align:center" value="${q[k]}" readonly><button class="btn secondary" onclick="q.${k}++;render()">+</button></div></div>`}
function stay(s,i){let hs=hotels.filter(h=>h[0]===s.city);return `<div class=box><div class=top><strong>Stay ${i+1} — ${s.city}</strong><span class=badge>${nights(s)} night(s)</span></div><div class=grid><div><label>Check-in</label><input type=date value="${s.in}" onchange="q.stays[${i}].in=this.value;render()"></div><div><label>Check-out</label><input type=date value="${s.out}" onchange="q.stays[${i}].out=this.value;render()"></div><div class=full><label>Hotel</label><select onchange="q.stays[${i}].hotel=this.value;render()"><option value="">Select hotel</option>${hs.map(h=>`<option ${s.hotel===h[1]?'selected':''}>${h[1]}</option>`).join('')}</select></div><div><label>Room Type</label><select onchange="q.stays[${i}].room=this.value;render()">${rooms.map(r=>`<option ${s.room===r?'selected':''}>${r}</option>`).join('')}</select></div><div><label>Rooms (0 = sharing)</label><input type=number min=0 value="${s.rooms}" onchange="q.stays[${i}].rooms=+this.value||0;render()"></div></div><div class=small>Distance: <b>${dist(s)}</b> • ${loc(s)}</div><div class=grand>${money(hcost(s))}</div></div>`}
function flight(f,i){return `<div class=box><div class=top><strong>${f.type} Leg</strong><button class="btn danger" onclick="q.flights.splice(${i},1);render()">Remove</button></div><div class=grid><div><label>From</label><select onchange="q.flights[${i}].from=this.value">${aopts(f.from)}</select></div><div><label>To</label><select onchange="q.flights[${i}].to=this.value">${aopts(f.to)}</select></div><div><label>Date</label><input type=date value="${f.date}" onchange="q.flights[${i}].date=this.value"></div><div><label>Flight #</label><input value="${f.flight}" onchange="q.flights[${i}].flight=this.value"></div><div><label>Airline</label><input value="${f.airline}" onchange="q.flights[${i}].airline=this.value"></div><div><label>Routing</label><select onchange="q.flights[${i}].via=this.value"><option>Direct</option><option>Dubai</option><option>Istanbul</option><option>Doha</option><option>Other</option></select></div></div></div>`}
function aopts(v){return airports.map(a=>`<option ${v===a[1]?'selected':''}>${a[1]}</option>`).join('')}
function obj(s){return hotels.find(h=>h[0]===s.city&&h[1]===s.hotel)}function dist(s){return obj(s)?.[3]||'—'}function loc(s){return obj(s)?.[2]||'—'}function nights(s){return s.in&&s.out?Math.max(0,Math.round((new Date(s.out)-new Date(s.in))/86400000)):0}function cityN(c){return q.stays.filter(s=>s.city===c).reduce((a,s)=>a+nights(s),0)}function hcost(s){let h=obj(s);if(!h)return 0;let r=h[4+rooms.indexOf(s.room)]||0,n=nights(s),eligible=q.adults+q.childBed;if(!r||!n)return 0;return (s.rooms>0||s.room==='Full Room'?r*Math.max(1,s.rooms):r*eligible)*n}function vp(k){let v=visas.find(v=>v.name===q.visa)||visas[0];return v?.[k]||0}function totals(){let hotel=q.stays.reduce((a,s)=>a+hcost(s),0),e=q.adults+q.childBed,ah=e?hotel*q.adults/e:0,ch=e?hotel*q.childBed/e:0,av=q.adults*vp('adult'),cv=(q.childBed+q.childNoBed)*vp('child'),iv=q.infants*vp('infant'),at=q.adults*q.tickets.adult/fx,ct=(q.childBed*q.tickets.childBed+q.childNoBed*q.tickets.childNoBed)/fx,it=q.infants*q.tickets.infant/fx,tr=q.transport.reduce((a,x)=>a+(transports.find(t=>t.name===x.name)?.price||0)*(x.qty||1),0),ex=q.extras.reduce((a,x)=>a+(extras.find(e=>e.name===x)?.price||0),0);return{av,cv,iv,ah,ch,at,ct,it,tr,ex,adult:av+ah+at,child:cv+ch+ct,infant:iv+it,hotel,grand:av+cv+iv+hotel+at+ct+it+tr+ex}}
function review(){let t=totals();return `<h3>Final Review</h3><div class=metric><div><span class=small>Adults</span><b>${q.adults}</b></div><div><span class=small>Children</span><b>${q.childBed+q.childNoBed}</b></div><div><span class=small>Infants</span><b>${q.infants}</b></div><div><span class=small>Total Nights</span><b>${cityN('Makkah')+cityN('Madinah')}</b></div></div><div class=box><div class=row><span>Adult Total<br><small>Visa ${money(t.av)} • Hotel ${money(t.ah)} • Ticket ${money(t.at)}</small></span><b>${money(t.adult)}</b></div><div class=row><span>Child Total<br><small>Visa ${money(t.cv)} • Hotel ${money(t.ch)} • Ticket ${money(t.ct)}</small></span><b>${money(t.child)}</b></div><div class=row><span>Infant Total<br><small>Visa ${money(t.iv)} • Hotel 0 • Ticket ${money(t.it)}</small></span><b>${money(t.infant)}</b></div><div class=row><span>Transport + Extras</span><b>${money(t.tr+t.ex)}</b></div><div class="row grand"><span>GROUP TOTAL</span><b>${money(t.grand)}</b></div><div class="row grand"><span>GROUP TOTAL PKR</span><b>${pkr(t.grand*fx)}</b></div></div><button class="btn primary" onclick="saveQuote()">Save & Generate Invoice</button>`}
function toggleExtra(n,on){if(on&&!q.extras.includes(n))q.extras.push(n);if(!on)q.extras=q.extras.filter(x=>x!==n)}function saveQuote(){q.total=totals().grand;q.id=Date.now();quotes.unshift(JSON.parse(JSON.stringify(q)));quotes=quotes.slice(0,50);localStorage.keaQuotes=JSON.stringify(quotes);renderInvoice();page('invoice',document.querySelectorAll('.nav button')[4])}
function renderInvoice(){let t=totals();$('invoiceBody').innerHTML=`<h3>KARVAN E ASAL</h3><div class=small>UMRAH PACKAGE QUOTATION • ${q.ref}</div><div class=section><h4>Customer</h4><div class=row><span>Name</span><b>${q.customer||'—'}</b></div><div class=row><span>Contact</span><b>${q.contact||'—'}</b></div></div><div class=section><h4>Passenger Cost Breakdown</h4><div class=row><span>Adult Total<br><small>Visa ${money(t.av)} • Hotel ${money(t.ah)} • Ticket ${money(t.at)}</small></span><b>${money(t.adult)}</b></div><div class=row><span>Child Total<br><small>Visa ${money(t.cv)} • Hotel ${money(t.ch)} • Ticket ${money(t.ct)}</small></span><b>${money(t.child)}</b></div><div class=row><span>Infant Total<br><small>Visa ${money(t.iv)} • Hotel 0 • Ticket ${money(t.it)}</small></span><b>${money(t.infant)}</b></div></div><div class=section><h4>Accommodation</h4>${q.stays.map((s,i)=>`<div class=row><span>${i+1}. ${s.city} — ${s.hotel||'Not selected'}<br><small>Distance: ${dist(s)} • ${nights(s)} nights • ${s.room}</small></span><b>${money(hcost(s))}</b></div>`).join('')}</div><div class=section><h4>Flights</h4>${q.flights.map(f=>`<div class=row><span>${f.type}: ${f.from} → ${f.to}<br><small>${f.date||'—'} • ${f.flight||'Flight # —'} • ${f.airline||'Airline —'} • ${f.via}</small></span></div>`).join('')}</div><div class=row grand><span>GROUP TOTAL</span><b>${money(t.grand)}</b></div><div class=row grand><span>GROUP TOTAL PKR</span><b>${pkr(t.grand*fx)}</b></div>`}
function manage(tab){let b=$('manageBody');if(tab==='hotels'){b.innerHTML=`<div style="margin-top:10px"><label>City</label><select id=mc onchange="hotelList()"><option>Makkah</option><option>Madinah</option></select><div id=hl></div></div>`;hotelList()}else if(tab==='visa'){b.innerHTML=`<button class="btn primary" style="margin-top:10px" onclick="addVisa()">+ Add New Visa Type</button><table class=table><tr><th>Visa</th><th>Adult</th><th>Child</th><th>Infant</th><th></th></tr>${visas.map((v,i)=>`<tr><td>${v.name}</td><td>${v.adult}</td><td>${v.child}</td><td>${v.infant}</td><td><button class="btn secondary" onclick="editVisa(${i})">Edit</button></td></tr>`).join('')}</table>`}else{let a=tab==='transport'?transports:extras;b.innerHTML=`<button class="btn primary" style="margin-top:10px" onclick="addSimple('${tab}')">+ Add New</button><table class=table><tr><th>Name</th><th>Price</th><th>Unit</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>${x.price}</td><td>${x.unit}</td></tr>`).join('')}</table>`}}
function hotelList(){let c=$('mc').value;let a=hotels.filter(h=>h[0]===c);$('hl').innerHTML=a.map(h=>`<div class=box><div class=top><b>${h[1]}</b><button class="btn secondary" onclick="editHotel(${hotels.indexOf(h)})">Edit</button></div><div class=small>${h[2]} • ${h[3]}</div><div class=small>${rooms.map((r,i)=>r+': '+(h[4+i]??'N/A')).join(' • ')}</div></div>`).join('')+`<button class="btn primary" onclick="addHotel('${c}')">+ Add New Hotel</button>`}
function addHotel(c){let n=prompt('Hotel name');if(!n)return;let l=prompt('Location',''),d=prompt('Distance',''),r=rooms.map(x=>{let v=prompt(x+' rate (blank=N/A)','');return v===''?null:+v});hotels.push([c,n,l,d,...r]);localStorage.keaHotels=JSON.stringify(hotels);hotelList()}function editHotel(i){let h=hotels[i];h[1]=prompt('Hotel name',h[1])||h[1];h[2]=prompt('Location',h[2])||h[2];h[3]=prompt('Distance',h[3])||h[3];rooms.forEach((x,j)=>{let v=prompt(x+' rate',h[4+j]??'');if(v!=='')h[4+j]=+v});localStorage.keaHotels=JSON.stringify(hotels);hotelList()}
function addVisa(){let n=prompt('New visa type');if(!n)return;visas.push({name:n,adult:+prompt('Adult price','0')||0,child:+prompt('Child price','0')||0,infant:+prompt('Infant price','0')||0,active:true});localStorage.keaVisa=JSON.stringify(visas);manage('visa')}function editVisa(i){let v=visas[i];v.name=prompt('Visa type',v.name)||v.name;v.adult=+prompt('Adult price',v.adult)||0;v.child=+prompt('Child price',v.child)||0;v.infant=+prompt('Infant price',v.infant)||0;v.active=confirm('Active?');localStorage.keaVisa=JSON.stringify(visas);manage('visa')}
function addSimple(tab){let n=prompt('Name');if(!n)return;let p=+prompt('Price','0')||0,u=prompt('Unit','per person')||'per person',a=tab==='transport'?transports:extras;a.push({name:n,price:p,unit:u});localStorage[tab==='transport'?'keaTransport':'keaExtras']=JSON.stringify(a);manage(tab)}
function dash(){$('qc').textContent=quotes.length;$('hc').textContent=hotels.length;$('vc').textContent=visas.length}function renderQuotes(){$('quotesBody').innerHTML=quotes.length?quotes.map((x,i)=>`<div class=box onclick="q=quotes[${i}];renderInvoice();page('invoice',document.querySelectorAll('.nav button')[4])"><div class=top><b>${x.ref}</b><span class=badge>${money(x.total)}</span></div><div class=small>${x.customer||'No customer'} • ${x.adults} adults • ${x.childBed+x.childNoBed} children • ${x.infants} infants</div></div>`).join(''):'<p class=small>No saved quotations.</p>'}
newQ();render();dash();
</script></body></html>
